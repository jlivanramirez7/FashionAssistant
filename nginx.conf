server {
  listen 8080;
  root /usr/share/nginx/html;
  gzip on;
  gzip_types text/css application/javascript application/json
             application/wasm;
  location / {
    try_files $uri $uri/ /index.html;
  }
  location = /sw.js {
    add_header Cache-Control "no-cache";
  }
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  # Same-origin Firebase Auth helper for signInWithRedirect (design doc
  # section 10). Do not add Cross-Origin-Opener-Policy: same-origin.
  location /__/auth/ {
    proxy_pass https://fashionassitant.firebaseapp.com;
    proxy_ssl_server_name on;
    proxy_set_header Host fashionassitant.firebaseapp.com;
  }
  location /__/firebase/ {
    proxy_pass https://fashionassitant.firebaseapp.com;
    proxy_ssl_server_name on;
    proxy_set_header Host fashionassitant.firebaseapp.com;
  }
}
